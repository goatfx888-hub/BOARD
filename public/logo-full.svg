<?xml version='1.0' encoding='UTF-8'?>
<svg viewBox='0 0 512 512' width='512' height='512' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <linearGradient id='bcAmberGradFull' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#fac338' />
      <stop offset='100%' stop-color='#f5a91f' />
    </linearGradient>
  </defs>

  <!-- Vertical Pitch Lawn Stripes Background -->
  <rect x='0' y='0' width='512' height='512' fill='#0d3d1f' />
  <rect x='64' y='0' width='64' height='512' fill='#124b27' />
  <rect x='192' y='0' width='64' height='512' fill='#124b27' />
  <rect x='320' y='0' width='64' height='512' fill='#124b27' />
  <rect x='448' y='0' width='64' height='512' fill='#124b27' />

  <!-- Amber Squircle Emblem in Center -->
  <g transform='translate(121, 70) scale(2.7)'>
    <!-- 3D Shadow Base -->
    <rect x='6' y='10' width='88' height='88' rx='26' fill='#d79316' />

    <!-- Main Amber Face -->
    <rect x='6' y='6' width='88' height='88' rx='26' fill='url(#bcAmberGradFull)' />

    <!-- Tactical Target 'X' -->
    <g stroke='#0c1826' stroke-width='7.5' stroke-linecap='round'>
      <line x1='52' y1='18' x2='66' y2='32' />
      <line x1='66' y1='18' x2='52' y2='32' />
    </g>

    <!-- Player Circle 'O' -->
    <circle cx='35' cy='52' r='9.5' stroke='#0c1826' stroke-width='7' fill='none' />

    <!-- Two Dotted Pass Points -->
    <circle cx='48' cy='46' r='3.4' fill='#0c1826' />
    <circle cx='55.5' cy='43' r='3.4' fill='#0c1826' />

    <!-- Curved Vector Run -->
    <path
      d='M 40.5 58 C 45 65, 57 65, 64 57 C 67 54, 69.5 49, 70.5 43.5'
      stroke='#0c1826'
      stroke-width='7'
      stroke-linecap='round'
      fill='none'
    />

    <!-- Arrowhead -->
    <path
      d='M 61.5 46.5 L 70.5 42.5 L 67.5 52'
      stroke='#0c1826'
      stroke-width='7'
      stroke-linecap='round'
      stroke-linejoin='round'
      fill='none'
    />
  </g>

  <!-- BE COACH Typography -->
  <text
    x='256'
    y='432'
    text-anchor='middle'
    fill='#f4f6ef'
    font-family='Impact, "Arial Black", -apple-system, sans-serif'
    font-size='68'
    font-weight='900'
    letter-spacing='2'
  >BE COACH</text>
</svg>
